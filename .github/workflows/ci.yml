name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*
      - name: Driver build check
        run: |
          sudo apt-get update && sudo apt-get install -y gcc make linux-headers-generic
          echo "running kernel: $(uname -r)"
          ls -d /lib/modules/*/build /usr/src/linux-headers-* 2>/dev/null || true
          cd driver && make
      - name: Build release
        run: cargo build --release
